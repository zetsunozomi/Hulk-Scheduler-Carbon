[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon-provisioning-replay"
version = "0.1.0"
description = "Deterministic fixed-work provisioning replay and exposure accounting"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
carbon-replay = "carbon.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["carbon", "carbon.*"]
